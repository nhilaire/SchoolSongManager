<div class="container">
  <header>
    <div class="status-badge" [ngClass]="{'success': apiStatus().includes('✅'), 'error': apiStatus().includes('❌')}">
      {{ apiStatus() }}
    </div>
  </header>

  <nav class="main-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Accueil</a>
    <a routerLink="/library" routerLinkActive="active">Bibliothèque de Comptines</a>
    <a routerLink="/themes" routerLinkActive="active">Gestion des Thèmes</a>
    <a routerLink="/assignments/list" routerLinkActive="active">Liste des Assignations</a>
  </nav>

  <main>
    <router-outlet></router-outlet>
  </main>
</div>
